name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: powercontract --version
      - run: powercontract check examples/boot.csv examples/boot.yaml
      - run: >-
          powercontract check
          examples/esp32-c3/usr_wf_C2_data.csv
          examples/esp32-c3/contract.yaml
          --with examples/esp32-c3/usr_wf_C3_data.csv

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check-package-links.py dist/*.whl
      - name: Install and smoke-test built wheel outside the checkout
        run: |
          python -m venv /tmp/powercontract-wheel
          /tmp/powercontract-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/powercontract-wheel/bin/powercontract --version
          /tmp/powercontract-wheel/bin/powercontract check             "$GITHUB_WORKSPACE/examples/boot.csv"             "$GITHUB_WORKSPACE/examples/boot.yaml"
