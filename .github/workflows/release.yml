name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify tag matches package version
        run: |
          python -m venv /tmp/powercontract-release
          /tmp/powercontract-release/bin/pip install dist/*.whl
          VERSION="$(
            cd /tmp &&
            /tmp/powercontract-release/bin/powercontract --version |
            awk '{print $2}'
          )"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
