name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/powercontract/__init__.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release checks
        run: |
          python -m pip install -e '.[dev]'
          pytest
          powercontract check examples/boot.csv examples/boot.yaml
          powercontract check \
            examples/esp32-c3/usr_wf_C2_data.csv \
            examples/esp32-c3/contract.yaml \
            --with examples/esp32-c3/usr_wf_C3_data.csv

      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check-package-links.py dist/*.whl

      - name: Resolve version and tag
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          python -m venv /tmp/powercontract-release
          /tmp/powercontract-release/bin/pip install dist/*.whl

          VERSION="$(
            cd /tmp &&
            /tmp/powercontract-release/bin/powercontract --version |
            awk '{print $2}'
          )"
          TAG="v$VERSION"

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "releases must run from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "PowerContract $TAG"
          git push origin "$TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"

  pypi:
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
