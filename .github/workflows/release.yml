name: Release

on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Verify tag matches package version
        run: |
          python -m venv /tmp/powercontract-release
          /tmp/powercontract-release/bin/pip install dist/*.whl
          VERSION="$(
            cd /tmp &&
            /tmp/powercontract-release/bin/powercontract --version |
            awk '{print $2}'
          )"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"

  pypi:
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
