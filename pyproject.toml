[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "powercontract"
dynamic = ["version"]
description = "Validate oscilloscope captures against executable electrical requirements."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sidelobe" }]
keywords = [
  "oscilloscope",
  "hardware-validation",
  "power-sequencing",
  "embedded",
  "electronics",
  "requirements-as-code",
]
dependencies = ["PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sidelobe-labs/powercontract"
PyPI = "https://pypi.org/project/powercontract/"
Repository = "https://github.com/sidelobe-labs/powercontract"
Issues = "https://github.com/sidelobe-labs/powercontract/issues"
Documentation = "https://github.com/sidelobe-labs/powercontract/tree/main/docs"
Changelog = "https://github.com/sidelobe-labs/powercontract/blob/main/CHANGELOG.md"

[project.scripts]
powercontract = "powercontract.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "twine>=6,<7",
]

[tool.setuptools.dynamic]
version = { attr = "powercontract.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
